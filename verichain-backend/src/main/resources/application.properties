spring.application.name=verichain-backend

# ---- Database ----
# Local MySQL database setup
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/verichain?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.h2.console.enabled=false

# ---- PostgreSQL (production) ----
# spring.datasource.url=jdbc:postgresql://localhost:5432/verichain
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=verichain_user
# spring.datasource.password=change_me

# ---- JPA ----
# validate in prod (let Flyway own the schema); update is convenient while H2 is in-memory for demos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Flyway ----
# Disabled by default because ddl-auto=update manages the H2 demo schema.
# Set to true + switch datasource to Postgres for a production-style setup with versioned migrations.
spring.flyway.enabled=false

# ---- JWT ----
verichain.jwt.secret=${JWT_SECRET:ChangeThisToALongRandomBase64EncodedSecretKeyForProductionUseOnly123456}
verichain.jwt.expiration-ms=86400000

# ---- Key management ----
# AES-256 master key (base64) used to encrypt each issuer's RSA private key at rest.
# In production this should come from a secrets manager / KMS, never committed to source.
verichain.keystore.master-secret=${MASTER_SECRET:VeriChainMasterKeyForAESEncryption2024ChangeMe}

# ---- Public verification ----
# Base URL the QR codes point to (the React verification page), not the API itself.
verichain.public-base-url=${PUBLIC_BASE_URL:http://localhost:5173}

# ---- Bootstrap admin (seeded on first startup only) ----
verichain.admin.email=${ADMIN_EMAIL:admin@verichain.com}
verichain.admin.password=${ADMIN_PASSWORD:ChangeMe123!}

# ---- Server ----
server.port=8080

# ---- Logging ----
logging.level.com.verichain=DEBUG
logging.level.org.springframework.security=INFO

# ---- File upload (for OCR verification, Phase 8) ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Request rate limiting ----
verichain.rate-limit.auth-per-minute=${AUTH_RATE_LIMIT:5}
verichain.rate-limit.public-per-minute=${PUBLIC_RATE_LIMIT:30}
